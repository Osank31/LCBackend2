services:
  mongodb:
    image: mongo:latest
    container_name: lc-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=mydb

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lc-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: lc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mail-service:
    build:
      context: ./3005_mail
    container_name: lc-mail-service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASSWORD=${MAIL_PASSWORD}

  auth-service:
    build:
      context: ./3004_authentication
    container_name: lc-auth-service
    ports:
      - "3004:3004"
    depends_on:
      mail-service:
        condition: service_started
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      - PORT=${AUTH_SERVICE_PORT}
      - MONGODB_URL=mongodb://mongodb:27017/mydb
      - MAIL_SERVICE_URL=${MAIL_SERVICE_URL}
      - ACCESS_TOKEN_JWT_KEY=${ACCESS_TOKEN_JWT_KEY}
      - REFRESH_TOKEN_JWT_KEY=${REFRESH_TOKEN_JWT_KEY}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  problem-service:
    build:
      context: ./3001_problem
    container_name: lc-problem-service
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_started
    environment:
      - PORT=${PROBLEM_SERVICE_PORT}
      - MONGODB_URL=mongodb://mongodb:27017/mydb
      - SUBMISSION_PORT=${SUBMISSION_SERVICE_PORT}
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  submission-service:
    build:
      context: ./3002_submission
    container_name: lc-submission-service
    ports:
      - "3002:3002"
    depends_on:
      rabbitmq:
        condition: service_healthy
      problem-service:
        condition: service_started
      mongodb:
        condition: service_started
    environment:
      - PORT=${SUBMISSION_SERVICE_PORT}
      - MONGODB_URL=mongodb://mongodb:27017/mydb
      - PROBLEM_URL=${PROBLEM_SERVICE_URL}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672

  evaluation-service:
    build:
      context: ./3003_evaluation
    container_name: lc-evaluation-service
    ports:
      - "3003:3003"
    depends_on:
      rabbitmq:
        condition: service_healthy
      submission-service:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=${EVALUATION_SERVICE_PORT}
      - SUBMISSION_URL=${SUBMISSION_SERVICE_URL}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672

  api-gateway:
    build:
      context: ./3000_apiGateway
    container_name: lc-api-gateway
    ports:
      - "3000:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      problem-service:
        condition: service_started
      submission-service:
        condition: service_started
    environment:
      - PORT=${API_GATEWAY_PORT}
      - ACCESS_TOKEN_JWT_KEY=${ACCESS_TOKEN_JWT_KEY}
      - REFRESH_TOKEN_JWT_KEY=${REFRESH_TOKEN_JWT_KEY}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - PROBLEM_SERVICE_URL=${PROBLEM_SERVICE_URL}
      - SUBMISSION_SERVICE_URL=${SUBMISSION_SERVICE_URL}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672

volumes:
  mongodb_data: