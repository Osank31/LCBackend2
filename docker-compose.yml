version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lc-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: lc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mail-service:
    build:
      context: ./3005_mail
    container_name: lc-mail-service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - MAIL_USER=osankverma2004@gmail.com
      - MAIL_PASSWORD=ceghsomgutnmhiya

  auth-service:
    build:
      context: ./3004_authentication
    container_name: lc-auth-service
    ports:
      - "3004:3004"
    depends_on:
      mail-service:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - PORT=3004
      - MONGODB_URL=mongodb+srv://osankverma2004_db_user:osank123@cluster0.vdn6bos.mongodb.net/?appName=Cluster0
      - MAIL_SERVICE_URL=http://mail-service:3005/api/v1
      - ACCESS_TOKEN_JWT_KEY=kuchbhi
      - REFRESH_TOKEN_JWT_KEY=kuchbhi
      - AWS_ACCESS_KEY=AKIAUN3LM4PBR6A5XF2E
      - AWS_SECRET_ACCESS_KEY=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
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  problem-service:
    build:
      context: ./3001_problem
    container_name: lc-problem-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URL=mongodb+srv://osankverma2004_db_user:osank123@cluster0.vdn6bos.mongodb.net/?appName=Cluster0
      - SUBMISSION_PORT=3002
      - OPENAI_API_KEY=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

  submission-service:
    build:
      context: ./3002_submission
    container_name: lc-submission-service
    ports:
      - "3002:3002"
    depends_on:
      rabbitmq:
        condition: service_healthy
      problem-service:
        condition: service_started
    environment:
      - PORT=3002
      - MONGODB_URL=mongodb+srv://osankverma2004_db_user:osank123@cluster0.vdn6bos.mongodb.net/?appName=Cluster0
      - PROBLEM_URL=http://problem-service:3001
      - RABBITMQ_URL=amqp://rabbitmq

  evaluation-service:
    build:
      context: ./3003_evaluation
    container_name: lc-evaluation-service
    ports:
      - "3003:3003"
    depends_on:
      rabbitmq:
        condition: service_healthy
      submission-service:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=3003
      - SUBMISSION_URL=http://submission-service:3002
      - RABBITMQ_URL=amqp://rabbitmq

  api-gateway:
    build:
      context: ./3000_apiGateway
    container_name: lc-api-gateway
    ports:
      - "3000:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      problem-service:
        condition: service_started
      submission-service:
        condition: service_started
    environment:
      - PORT=3000
      - ACCESS_TOKEN_JWT_KEY=kuchbhi
      - REFRESH_TOKEN_JWT_KEY=kuchbhi
      - AUTH_SERVICE_URL=http://auth-service:3004
      - PROBLEM_SERVICE_URL=http://problem-service:3001
      - SUBMISSION_SERVICE_URL=http://submission-service:3002
      - RABBITMQ_URL=amqp://rabbitmq
